name: Build
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.11.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle
      - run: pnpm run test --coverage
      - uses: ./
        with:
          coverage-file: coverage/coverage-final.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.11.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
  prettier:
    runs-on: ubuntu-latest
    name: Prettier
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.11.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.11.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
